# Export the LiaScript course to SCORM 1.2, SCORM 2004 and xAPI on every push
# to main, publish the packages together with a project index page on the
# gh-pages branch, and keep the zips as workflow artifacts.
#
# One-time setup after the first run: Settings -> Pages -> Source: branch gh-pages
# (see specs/data/liascript-workflows.md, section 7).

name: Export LiaScript Course (SCORM + xAPI)

on:
  push:
    branches:
      - main
    paths:
      - "materials/**"
      - "project.yaml"
      - ".github/workflows/export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      COURSE: materials/01-once-only-prinzip/README.md
      OUT_DIR: public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install LiaScript Exporter
        run: npm install -g @liascript/exporter

      - name: Prepare output directory
        run: mkdir -p "$OUT_DIR"

      - name: Export SCORM 1.2
        # scorm1.2 stores only the location; add --scorm-embed for Moodle 4 / OPAL / Open edX
        run: >
          liaex -i "$COURSE" --format scorm1.2
          --output "$OUT_DIR/once-only-scorm1.2"
          --scorm-organization "LiaPlayground"
          --scorm-masteryScore 80

      - name: Export SCORM 2004
        # scorm2004 persists quiz/survey state; add --scorm-iframe for ILIAS / OpenOLAT
        run: >
          liaex -i "$COURSE" --format scorm2004
          --output "$OUT_DIR/once-only-scorm2004"
          --scorm-organization "LiaPlayground"
          --scorm-masteryScore 80

      - name: Export xAPI
        # Self-contained package with tincan.xml; the LRS endpoint is configured in the LMS
        run: >
          liaex -i "$COURSE" --format xapi
          --output "$OUT_DIR/once-only-xapi"
          --xapi-zip

      - name: Install Chromium system dependencies (required for PDF and ePub)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libasound2t64 libnss3 libnspr4 \
            fonts-liberation ca-certificates wget

      - name: Export PDF
        env:
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"
        run: >
          liaex -i "$COURSE" --format pdf
          --output "$OUT_DIR/once-only"
          --pdf-timeout 60000

      - name: Export ePub
        # --epub-cover is passed explicitly: the exporter resolves the relative
        # header logo against the working directory, not the course folder
        env:
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"
        run: >
          liaex -i "$COURSE" --format epub
          --output "$OUT_DIR/once-only"
          --epub-title "Grundlagen des Once-Only-Prinzips und Registermodernisierung"
          --epub-author "GovTech Enablement"
          --epub-language de
          --epub-toc-title "Inhalt"
          --epub-cover materials/01-once-only-prinzip/assets/images/cover-kf02.jpg
          --epub-timeout 60000

      - name: Generate project index page
        # The project exporter only accepts http(s) URLs and raw.githubusercontent.com
        # returns 404 for private repos (and can lag right after a push). So the index
        # is built against a local static server on the checkout, and the links are
        # rewritten back to the public raw URLs afterwards.
        env:
          RAW_BASE: https://raw.githubusercontent.com/LiaPlayground/Demo-12/main/
          LOCAL_BASE: http://127.0.0.1:8000/
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/dev/null 2>&1 &
          sleep 2
          sed "s#$RAW_BASE#$LOCAL_BASE#g" project.yaml > project.local.yaml
          liaex -i project.local.yaml --format project --output index
          sed -i "s#$LOCAL_BASE#$RAW_BASE#g" index.html
          mv index.html "$OUT_DIR/index.html"
          rm -f project.local.yaml

      - name: List generated files
        run: ls -la "$OUT_DIR"

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liascript-exports
          path: |
            ${{ env.OUT_DIR }}/*.zip
            ${{ env.OUT_DIR }}/*.pdf
            ${{ env.OUT_DIR }}/*.epub
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ env.OUT_DIR }}
          force_orphan: true
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"

      - name: Output website URL
        run: |
          echo "Deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
